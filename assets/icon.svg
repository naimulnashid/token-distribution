<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Token Distribution">
  <!-- True-black tile so the mark keeps its own ground on light and dark pages. -->
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1e1e22"/>

  <!-- A donut in the pane's own token colours, cache read largest as it is in
       practice. Each arc is a dash on one circle (r 9, circumference 56.55),
       starting at 12 o'clock; 1-unit gaps keep the arcs apart at 16px. -->
  <g fill="none" stroke-width="4.5" transform="rotate(-90 16 16)">
    <circle cx="16" cy="16" r="9" stroke="#3BA374" stroke-dasharray="32.9 23.65" stroke-dashoffset="0"/>
    <circle cx="16" cy="16" r="9" stroke="#D45C9E" stroke-dasharray="7.5 49.05" stroke-dashoffset="-33.9"/>
    <circle cx="16" cy="16" r="9" stroke="#9B7BE0" stroke-dasharray="4.7 51.85" stroke-dashoffset="-42.4"/>
    <circle cx="16" cy="16" r="9" stroke="#D97757" stroke-dasharray="3.5 53.05" stroke-dashoffset="-48.1"/>
    <circle cx="16" cy="16" r="9" stroke="#5B8DEF" stroke-dasharray="2.95 53.6" stroke-dashoffset="-52.6"/>
  </g>

  <!-- Clock hands: the cache timers. Strokes stay at 2 units so they hold at 16px. -->
  <g stroke="#E8EAEE" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="11.6"/>
    <line x1="16" y1="16" x2="19" y2="17.6"/>
  </g>
</svg>
