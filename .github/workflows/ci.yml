name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The CLI needs Node 22 or newer; 24 is what the mod is tested with.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Pinned to the release the mod was built against: the mod API is early
      # access and may change between releases. Raise it deliberately.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.309

      - name: Validate
        run: claude plugin validate .
        env:
          DISABLE_AUTOUPDATER: 1

      - name: Test
        run: claude plugin test .
        env:
          DISABLE_AUTOUPDATER: 1
